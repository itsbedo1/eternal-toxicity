<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>منشور فيسبوك - إعلان صرف الرواتب</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 24px;
    background: #eef0f2;
    font-family: 'Tajawal', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; }
  .toolbar button {
    font-family: 'Tajawal', sans-serif;
    background: #1E3A8A;
    color: #fff;
    border: none;
    padding: 12px 22px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }
  .toolbar button:hover { filter: brightness(1.1); }

  .hint {
    color: #6b6b6b;
    font-size: 13px;
    margin-bottom: 16px;
    text-align: center;
    max-width: 500px;
  }

  .stage {
    width: min(94vw, 1080px);
    aspect-ratio: 1 / 1;
    overflow: hidden;
    position: relative;
  }

  .scaler {
    width: 1080px;
    height: 1080px;
    position: absolute;
    top: 0;
    left: 0;
    transform: scale(calc(min(94vw, 1080px) / 1080px));
    transform-origin: top left;
  }

  .post {
    width: 1080px;
    height: 1080px;
    background: #F0FDF4;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  .top-bar {
    height: 10px;
    background: #166534;
    width: 100%;
  }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 60px 70px 40px;
    position: relative;
    z-index: 2;
  }

  .gold-frame {
    position: absolute;
    inset: 28px;
    border: 1.5px solid rgba(217,119,6,0.35);
    border-radius: 6px;
    pointer-events: none;
    z-index: 1;
  }

  .office-name {
    text-align: center;
    font-size: 44px;
    font-weight: 900;
    color: #1E3A8A;
    outline: none;
    line-height: 1.25;
  }
  .office-tagline {
    text-align: center;
    font-size: 20px;
    color: #555;
    font-weight: 500;
    margin-top: 6px;
    outline: none;
  }

  .divider {
    height: 2px;
    background: #d6ece0;
    margin: 28px 0;
  }

  .accept-label {
    text-align: center;
    font-size: 15px;
    color: #999;
    margin-bottom: 12px;
    font-weight: 500;
  }
  .banks-row {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 32px;
  }
  .bank-chip {
    background: #fffdf7;
    border: 1.5px solid #D97706;
    border-radius: 30px;
    padding: 10px 22px;
    font-size: 18px;
    font-weight: 700;
    color: #B45309;
  }

  .headline {
    text-align: center;
    margin-bottom: 30px;
  }
  .headline .main {
    font-size: 50px;
    font-weight: 900;
    color: #166534;
  }

  .info-box {
    flex: 1;
    border: 2px solid #c9e7d5;
    border-radius: 14px;
    padding: 36px 40px;
    font-size: 30px;
    line-height: 1.9;
    font-weight: 500;
    color: #222;
    outline: none;
    background: #ffffff;
  }
  .info-box:empty::before {
    content: "اكتب هنا تفاصيل الراتب اللي نزل (الجهة، الشهر، تاريخ الصرف، أي ملاحظات)";
    color: #a8a8a8;
    font-size: 24px;
  }

  footer {
    margin-top: 30px;
    padding-top: 24px;
    border-top: 2px solid #d6ece0;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 22px;
    font-weight: 700;
    color: #166534;
  }
  footer .field { outline: none; }
  footer .label { color: #999; margin-left: 6px; font-weight: 500; }

  [contenteditable="true"]:focus {
    box-shadow: 0 0 0 2px #1E3A8A;
    border-radius: 4px;
  }
</style>
</head>
<body>

  <div class="toolbar">
    <button id="downloadBtn">⬇️ تحميل كصورة (PNG)</button>
  </div>
  <div class="hint">اضغط على أي نص وعدله مباشرة، بعدين اضغط "تحميل كصورة" ونشره بفيسبوك مباشرة.</div>

  <div class="stage">
   <div class="scaler">
    <div class="post" id="post">
      <div class="top-bar"></div>
      <div class="gold-frame"></div>
      <div class="content">
        <div class="office-name" contenteditable="true">منفذ علا المنير</div>
        <div class="office-tagline" contenteditable="true">منفذ صرف رواتب المتقاعدين والموظفين</div>

        <div class="divider"></div>

        <div class="accept-label">مقبول لدى</div>
        <div class="banks-row">
          <div class="bank-chip">Qi Card</div>
          <div class="bank-chip">مصرف الرافدين</div>
          <div class="bank-chip">مصرف الرشيد</div>
          <div class="bank-chip">مصرف التنمية</div>
        </div>

        <div class="headline"><span class="main">نزل الراتب ✅</span></div>

        <div class="info-box" contenteditable="true"></div>

        <footer>
          <div class="field" contenteditable="true"><span class="label">📞</span><span dir="ltr" style="unicode-bidi: isolate;">0773 333 2499 - 0782 333 3008</span></div>
          <div class="field" contenteditable="true"><span class="label">📍</span>الغزالية، شارع مدير الأمن، مقابل ألعاب الزيتون</div>
        </footer>
      </div>
    </div>
   </div>
  </div>

<script>
document.getElementById('downloadBtn').addEventListener('click', function() {
  const post = document.getElementById('post');
  html2canvas(post, { width: 1080, height: 1080, scale: 1, backgroundColor: '#F0FDF4', foreignObjectRendering: true }).then(canvas => {
    const link = document.createElement('a');
    link.download = 'salary-announcement.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
});
</script>

</body>
</html>
